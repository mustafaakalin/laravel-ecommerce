name: Security checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: sail
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U sail -d testing"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_pgsql
          coverage: none
          tools: composer

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Composer audit
        run: composer audit --locked --no-interaction

      - name: Configure environment
        run: |
          cp .env.example .env
          php artisan key:generate
          sed -i 's|^APP_ENV=.*|APP_ENV=testing|' .env
          sed -i 's|^DB_CONNECTION=.*|DB_CONNECTION=pgsql|' .env
          sed -i 's|^DB_HOST=.*|DB_HOST=127.0.0.1|' .env
          sed -i 's|^DB_PORT=.*|DB_PORT=5432|' .env
          sed -i 's|^DB_DATABASE=.*|DB_DATABASE=testing|' .env
          sed -i 's|^DB_USERNAME=.*|DB_USERNAME=sail|' .env
          sed -i 's|^DB_PASSWORD=.*|DB_PASSWORD=password|' .env
          sed -i 's|^SCOUT_DRIVER=.*|SCOUT_DRIVER=database|' .env

      - name: PHP syntax check
        run: |
          find app config routes database -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Tests
        run: php artisan test --without-tty
